---
# Validação estática da PoC: formatação, sintaxe, análise de segurança, segredos e lint.
# Também registra as versões exatas das ferramentas (insumo da Tabela 4.1 do TCC) e roda o teste de
# detecção de deficiências plantadas (métrica M4). Nenhum recurso é provisionado aqui.
name: validar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - uses: terraform-linters/setup-tflint@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de análise
        run: |
          pip install --quiet ansible-core ansible-lint yamllint checkov docker pandas scipy
          curl -fsSL -o trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          tar -xzf trivy.tgz trivy && sudo mv trivy /usr/local/bin/ && rm trivy.tgz
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tgz
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Registrar versões
        run: |
          mkdir -p resultados
          {
            echo "data_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_imagem: ${ImageOS:-?} ${ImageVersion:-?}"
            echo "cpu: $(nproc) vCPU; memoria: $(free -m | awk '/Mem:/ {print $2}') MB"
            echo "docker: $(docker --version)"
            echo "tofu: $(tofu version | head -n1)"
            echo "ansible: $(ansible --version | head -n1)"
            echo "tflint: $(tflint --version | head -n1)"
            echo "trivy: $(trivy --version | head -n1)"
            echo "checkov: $(checkov --version)"
            echo "ansible-lint: $(ansible-lint --version | head -n1)"
            echo "yamllint: $(yamllint --version)"
            echo "gitleaks: $(gitleaks version)"
            echo "python: $(python --version)"
          } | tee resultados/versoes.txt

      - name: tofu fmt
        continue-on-error: true
        run: tofu -chdir=terraform fmt -check -recursive -diff

      - name: tofu validate
        continue-on-error: true
        run: |
          tofu -chdir=terraform init -backend=false -input=false
          tofu -chdir=terraform validate

      - name: tflint
        continue-on-error: true
        run: |
          cd terraform
          tflint --init
          tflint --recursive --format compact

      - name: trivy config
        continue-on-error: true
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL terraform

      - name: ansible-lint
        continue-on-error: true
        run: |
          cd ansible
          ansible-lint site.yml teardown.yml

      - name: yamllint
        continue-on-error: true
        run: yamllint -c .yamllint .

      - name: gitleaks
        continue-on-error: true
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

      - name: Teste de deficiências plantadas (M4)
        if: always()
        run: bash medicao/seguranca_plantada.sh -o resultados/seguranca.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validacao-versoes-seguranca
          path: resultados/
